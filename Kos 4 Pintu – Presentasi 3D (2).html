const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const ease=k=>1-Math.pow(1-clamp(k,0,1),3);
let lastT=performance.now(),start0=performance.now(),th=-.9,ph=1,r=28,tth=.55,tph=.95,tr=23,auto=true,mode='orbit',w0=0;
const K=[[6.8,1.7,10.5,6.8,1.3,6],[6.9,1.6,8,6.9,1.3,5],[7.1,1.6,5.6,7.1,1.3,3],[7.1,1.6,4,5.2,1,3],[7.1,1.6,3,7.1,1.3,1],[6.9,1.6,2,6.2,1,.4]];

function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
function loop(now){
  const t=(now-start0)/1000;
  A.forEach(a=>{const k=ease((t-a.d)/a.dur);
    if(a.k==='w')a.o.scale.y=Math.max(.001,k);
    else if(a.k==='r'){a.o.visible=roofOn&&t>=a.d;a.o.position.y=(1-k)*5}
    else{a.o.visible=t>=a.d;a.o.position.y=(1-k)*4}});
  labs.visible=t>6.5;
  if(mode==='walk'){
    const s=(now-w0)/3000,i=Math.floor(s);
    if(i>=K.length-1){mode='orbit';tr=23;tph=.95;auto=true}
    else{const f=s-i,e=f*f*(3-2*f),a=K[i],b=K[i+1],Lp=j=>a[j]+(b[j]-a[j])*e;

  }
  if(mode!=='walk'){
    if(auto)tth+=.002;
    th+=(tth-th)*.08;ph+=(tph-ph)*.08;r+=(tr-r)*.08;
    const rs=cam.aspect<1?1+(1-cam.aspect)*1.2:1;cam.position.set(Math.sin(ph)*Math.sin(th)*r*rs,Math.cos(ph)*r*rs,Math.sin(ph)*Math.cos(th)*r*rs);cam.lookAt(0,1,0);
  }

  const fp=mode==='fp';$('hint').style.display=$('joy').style.display=fp?'block':'none';
  const tf=fp?72:45;if(cam.fov!==tf){cam.fov=tf;cam.updateProjectionMatrix()}

    const fx=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)+jy,sx=(keys.KeyD?1:0)-(keys.KeyA?1:0)+jx;
    if(keys.ArrowLeft)yaw+=1.6*dt;if(keys.ArrowRight)yaw-=1.6*dt;
    const sp=(keys.ShiftLeft?3.2:1.6)*dt;
    tryMove((-Math.sin(yaw)*fx+Math.cos(yaw)*sx)*sp,0);tryMove(0,(-Math.cos(yaw)*fx-Math.sin(yaw)*sx)*sp);
    cam.position.set(pp.x+off.x,1.6,pp.z+off.z);cam.rotation.set(pitch,yaw,0);
  }
  R.render(S,cam);requestAnimationFrame(loop);
}

let jx=0,jy=0,yaw=0,pitch=0;const pp={x:6.82,z:9.2},keys={};cam.rotation.order='YXZ';
function hit(x,z){const r=.22;for(const [x1,x2,z1,z2] of colliders){const cx=Math.max(x1,Math.min(x,x2)),cz=Math.max(z1,Math.min(z,z2));if((x-cx)*(x-cx)+(z-cz)*(z-cz)<r*r)return true}return false}
